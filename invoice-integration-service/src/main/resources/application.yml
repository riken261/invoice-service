spring:
  application:
    name: invoice-integration-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

management:
  observations:
    key-values:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    propagation:
      produce:
        - W3C
      consume:
        - W3C
    sampling:
      probability: 1.0

