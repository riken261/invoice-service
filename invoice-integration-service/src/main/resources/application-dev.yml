server:
  port: 8086

invoice:
  integration:
    ocr:
      provider: ${INVOICE_INTEGRATION_OCR_PROVIDER:TENCENT_CLOUD}
      mock-enabled: ${INVOICE_INTEGRATION_OCR_MOCK_ENABLED:false}
      tencent:
        enabled: ${INVOICE_TENCENT_OCR_ENABLED:true}
        endpoint: ${INVOICE_TENCENT_OCR_ENDPOINT:https://ocr.tencentcloudapi.com}
        host: ${INVOICE_TENCENT_OCR_HOST:ocr.tencentcloudapi.com}
        service: ${INVOICE_TENCENT_OCR_SERVICE:ocr}
        version: ${INVOICE_TENCENT_OCR_VERSION:2018-11-19}
        region: ${INVOICE_TENCENT_OCR_REGION:ap-beijing}
        language: ${INVOICE_TENCENT_OCR_LANGUAGE:zh-CN}
        secret-id: ${INVOICE_TENCENT_OCR_SECRET_ID:}
        secret-key: ${INVOICE_TENCENT_OCR_SECRET_KEY:}
        token: ${INVOICE_TENCENT_OCR_TOKEN:}
        timeout: ${INVOICE_TENCENT_OCR_TIMEOUT:30s}
    storage:
      provider: ${INVOICE_INTEGRATION_STORAGE_PROVIDER:TENCENT_COS}
      storage-type: ${INVOICE_INTEGRATION_STORAGE_TYPE:OSS}
      bucket: ${INVOICE_STORAGE_BUCKET:invoice-internal-box-1318043617}
      local-root: ${INVOICE_STORAGE_LOCAL_ROOT:build/storage/invoice-files}
      public-base-url: ${INVOICE_STORAGE_PUBLIC_BASE_URL:}
      presign-expires: ${INVOICE_STORAGE_PRESIGN_EXPIRES:10m}
      local:
        enabled: ${INVOICE_STORAGE_LOCAL_ENABLED:false}
      tencent:
        enabled: ${INVOICE_STORAGE_TENCENT_ENABLED:true}
        region: ${INVOICE_STORAGE_TENCENT_REGION:ap-beijing}
        secret-id: ${INVOICE_STORAGE_TENCENT_SECRET_ID:}
        secret-key: ${INVOICE_STORAGE_TENCENT_SECRET_KEY:}
        connection-timeout: ${INVOICE_STORAGE_TENCENT_CONNECTION_TIMEOUT:3s}
        socket-timeout: ${INVOICE_STORAGE_TENCENT_SOCKET_TIMEOUT:10s}

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://192.168.3.22:4318/v1/traces

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://192.168.3.22:5432/postgres?currentSchema=invoice_reimbursement
    username: pgsql
    password: pgsql
    hikari:
      maximum-pool-size: ${INVOICE_DATASOURCE_MAX_POOL_SIZE:3}
      minimum-idle: ${INVOICE_DATASOURCE_MIN_IDLE:1}
      idle-timeout: ${INVOICE_DATASOURCE_IDLE_TIMEOUT_MS:30000}
      max-lifetime: ${INVOICE_DATASOURCE_MAX_LIFETIME_MS:600000}
