server:
  port: 8082

invoice:
  core:
    file-service:
      base-url: ${INVOICE_FILE_SERVICE_BASE_URL:http://localhost:8081}
    ocr-service:
      base-url: ${INVOICE_OCR_SERVICE_BASE_URL:http://localhost:8083}
    common-service:
      base-url: ${INVOICE_COMMON_SERVICE_BASE_URL:http://localhost:8088}
    recognition:
      timeout-seconds: ${INVOICE_RECOGNITION_TIMEOUT_SECONDS:30}
      next-poll-after-ms: ${INVOICE_RECOGNITION_NEXT_POLL_AFTER_MS:1000}
      source: ${INVOICE_RECOGNITION_SOURCE:CAMERA}

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://192.168.3.22:4318/v1/traces

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://192.168.3.22:5432/postgres?currentSchema=invoice_reimbursement
    username: pgsql
    password: pgsql
    hikari:
      maximum-pool-size: ${INVOICE_DATASOURCE_MAX_POOL_SIZE:3}
      minimum-idle: ${INVOICE_DATASOURCE_MIN_IDLE:1}
      idle-timeout: ${INVOICE_DATASOURCE_IDLE_TIMEOUT_MS:30000}
      max-lifetime: ${INVOICE_DATASOURCE_MAX_LIFETIME_MS:600000}
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
