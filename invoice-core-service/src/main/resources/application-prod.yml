server:
  port: ${CORE_SERVICE_SERVER_PORT:8080}

invoice:
  core:
    file-service:
      base-url: ${INVOICE_FILE_SERVICE_BASE_URL}
    ocr-service:
      base-url: ${INVOICE_OCR_SERVICE_BASE_URL}
    common-service:
      base-url: ${INVOICE_COMMON_SERVICE_BASE_URL}
    recognition:
      timeout-seconds: ${INVOICE_RECOGNITION_TIMEOUT_SECONDS}
      next-poll-after-ms: ${INVOICE_RECOGNITION_NEXT_POLL_AFTER_MS}
      source: ${INVOICE_RECOGNITION_SOURCE}

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://jaeger-collector:4318/v1/traces}

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${INVOICE_DATASOURCE_URL}
    username: ${INVOICE_DATASOURCE_USERNAME}
    password:  ${INVOICE_DATASOURCE_PASSWORD}

logging:
  structured:
    format:
      console: logstash
