server:
  port: ${FILE_SERVICE_SERVER_PORT:8080}

invoice:
  file:
    storage:
      provider: ${INVOICE_FILE_STORAGE_PROVIDER}
      type: ${INVOICE_FILE_STORAGE_TYPE}
      bucket: ${INVOICE_FILE_STORAGE_BUCKET}
    max-size-bytes: ${INVOICE_FILE_MAX_SIZE_BYTES}
    allowed-content-types: ${INVOICE_FILE_ALLOWED_CONTENT_TYPES}
    access:
      preview-expires-seconds: ${INVOICE_FILE_PREVIEW_EXPIRES_SECONDS}
      download-expires-seconds: ${INVOICE_FILE_DOWNLOAD_EXPIRES_SECONDS}
    integration:
      base-url: ${INVOICE_INTEGRATION_SERVICE_BASE_URL}

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://jaeger-collector:4318/v1/traces}

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${INVOICE_DATASOURCE_URL}
    username: ${INVOICE_DATASOURCE_USERNAME}
    password: ${INVOICE_DATASOURCE_PASSWORD}

logging:
  structured:
    format:
      console: logstash
