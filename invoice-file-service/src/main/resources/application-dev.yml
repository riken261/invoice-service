server:
  port: 8081

invoice:
  file:
    storage:
      provider: ${INVOICE_FILE_STORAGE_PROVIDER:TENCENT_COS}
      type: ${INVOICE_FILE_STORAGE_TYPE:OSS}
      bucket: ${INVOICE_FILE_STORAGE_BUCKET:invoice-internal-box-1318043617}
    max-size-bytes: ${INVOICE_FILE_MAX_SIZE_BYTES:20971520}
    allowed-content-types: ${INVOICE_FILE_ALLOWED_CONTENT_TYPES:application/pdf,image/jpeg,image/png}
    access:
      preview-expires-seconds: ${INVOICE_FILE_PREVIEW_EXPIRES_SECONDS:600}
      download-expires-seconds: ${INVOICE_FILE_DOWNLOAD_EXPIRES_SECONDS:300}
    integration:
      base-url: ${INVOICE_INTEGRATION_SERVICE_BASE_URL:http://localhost:8086}

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://192.168.3.22:4318/v1/traces

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://192.168.3.22:5432/postgres?currentSchema=invoice_reimbursement
    username: pgsql
    password: pgsql
    hikari:
      maximum-pool-size: ${INVOICE_DATASOURCE_MAX_POOL_SIZE:3}
      minimum-idle: ${INVOICE_DATASOURCE_MIN_IDLE:1}
      idle-timeout: ${INVOICE_DATASOURCE_IDLE_TIMEOUT_MS:30000}
      max-lifetime: ${INVOICE_DATASOURCE_MAX_LIFETIME_MS:600000}
