server:
  port: 8087
management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://192.168.3.22:4318/v1/traces

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://192.168.3.22:5432/postgres?currentSchema=invoice_reimbursement
    username: pgsql
    password: pgsql
    hikari:
      maximum-pool-size: ${INVOICE_DATASOURCE_MAX_POOL_SIZE:3}
      minimum-idle: ${INVOICE_DATASOURCE_MIN_IDLE:1}
      idle-timeout: ${INVOICE_DATASOURCE_IDLE_TIMEOUT_MS:30000}
      max-lifetime: ${INVOICE_DATASOURCE_MAX_LIFETIME_MS:600000}
  data:
    redis:
      host: ${INVOICE_REDIS_HOST:192.168.3.22}
      port: ${INVOICE_REDIS_PORT:6379}
      database: ${INVOICE_REDIS_DATABASE:0}
      password: ${INVOICE_REDIS_PASSWORD:}

invoice:
  authorization:
    auth:
      keycloak:
        issuer-base-uri: ${INVOICE_KEYCLOAK_ISSUER_BASE_URI:http://192.168.3.22:8080/realms}
        realm: ${INVOICE_KEYCLOAK_REALM:invoice}
        client-id: ${INVOICE_KEYCLOAK_CLIENT_ID:invoice-internal-gateway}
        client-secret: ${INVOICE_KEYCLOAK_CLIENT_SECRET:invoice-internal-gateway-dev-secret}
        callback-uri: ${INVOICE_AUTH_CALLBACK_URI:http://localhost:8080/invoice-authorization-service/bff/v1/auth/callback}
        redirect-url: ${INVOICE_AUTH_REDIRECT_URL:http://192.168.3.25:5173/dashboard}
      session:
        secure: ${INVOICE_BFF_SESSION_SECURE:false}
