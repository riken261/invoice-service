spring:
  application:
    name: invoice-authorization-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

management:
  observations:
    key-values:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    propagation:
      produce:
        - W3C
      consume:
        - W3C
    sampling:
      probability: 1.0

invoice:
  authorization:
    auth:
      keycloak:
        issuer-base-uri: ${INVOICE_KEYCLOAK_ISSUER_BASE_URI:http://192.168.3.22:8080/realms}
        realm: ${INVOICE_KEYCLOAK_REALM:invoice}
        client-id: ${INVOICE_KEYCLOAK_CLIENT_ID:invoice-internal-gateway}
        client-secret: ${INVOICE_KEYCLOAK_CLIENT_SECRET:}
        callback-uri: ${INVOICE_AUTH_CALLBACK_URI:http://localhost:8080/invoice-authorization-service/bff/v1/auth/callback}
        redirect-url: ${INVOICE_AUTH_REDIRECT_URL:http://localhost:5173/dashboard}
      login-state:
        expires-in: ${INVOICE_AUTH_LOGIN_STATE_EXPIRES_IN:5m}
        redis-key-prefix: ${INVOICE_AUTH_LOGIN_STATE_REDIS_KEY_PREFIX:invoice:authorization:login-state:}
      session:
        cookie-name: ${INVOICE_BFF_SESSION_COOKIE_NAME:INVOICE_BFF_SESSION}
        expires-in: ${INVOICE_BFF_SESSION_EXPIRES_IN:8h}
        secure: ${INVOICE_BFF_SESSION_SECURE:false}
        same-site: ${INVOICE_BFF_SESSION_SAME_SITE:Lax}
        redis-key-prefix: ${INVOICE_BFF_SESSION_REDIS_KEY_PREFIX:invoice:gateway:bff-session:}
