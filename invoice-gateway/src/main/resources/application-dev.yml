server:
  port: 8080

spring:
  data:
    redis:
      host: ${INVOICE_REDIS_HOST:192.168.3.22}
      port: ${INVOICE_REDIS_PORT:6379}
      database: ${INVOICE_REDIS_DATABASE:0}
      password: ${INVOICE_REDIS_PASSWORD:}

invoice:
  services:
    file:
      application-name: invoice-file-service
      uri: http://localhost:8081
    core:
      application-name: invoice-core-service
      uri: http://localhost:8082
    ocr:
      application-name: invoice-ocr-service
      uri: http://localhost:8083
    review:
      application-name: invoice-review-service
      uri: http://localhost:8084
    claim:
      application-name: invoice-claim-service
      uri: http://localhost:8085
    integration:
      application-name: invoice-integration-service
      uri: http://localhost:8086
    authorization:
      application-name: invoice-authorization-service
      uri: http://localhost:8087
    common:
      application-name: invoice-common-service
      uri: http://localhost:8088

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://192.168.3.22:4318/v1/traces
