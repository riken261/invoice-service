server:
  port: ${COMMON_SERVICE_SERVER_PORT:8080}

invoice:
  common:
    session:
      cookie-name: ${INVOICE_BFF_SESSION_COOKIE_NAME}
      redis-key-prefix: ${INVOICE_BFF_SESSION_REDIS_KEY_PREFIX}
    nonce:
      expires-seconds: ${INVOICE_NONCE_EXPIRES_SECONDS}
      redis-key-prefix: ${INVOICE_NONCE_REDIS_KEY_PREFIX}
    core-service:
      base-url: ${INVOICE_CORE_SERVICE_BASE_URL}
    claim-service:
      base-url: ${INVOICE_CLAIM_SERVICE_BASE_URL}

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://jaeger-collector:4318/v1/traces}

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${INVOICE_DATASOURCE_URL}
    username: ${INVOICE_DATASOURCE_USERNAME}
    password:  ${INVOICE_DATASOURCE_PASSWORD}
  data:
    redis:
      host: ${INVOICE_REDIS_HOST}
      port: ${INVOICE_REDIS_PORT}
      database: ${INVOICE_REDIS_DATABASE}
      password: ${INVOICE_REDIS_PASSWORD:}

logging:
  structured:
    format:
      console: logstash
