server:
  port: 8083

invoice:
  ocr:
    vat-verify-enabled: ${INVOICE_OCR_VAT_VERIFY_ENABLED:true}
    base-confidence: ${INVOICE_OCR_BASE_CONFIDENCE:0.85}
    low-confidence-threshold: ${INVOICE_OCR_LOW_CONFIDENCE_THRESHOLD:0.70}
    integration:
      base-url: ${INVOICE_INTEGRATION_SERVICE_BASE_URL:http://localhost:8086}

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://192.168.3.22:4318/v1/traces

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://192.168.3.22:5432/postgres?currentSchema=invoice_reimbursement
    username: pgsql
    password: pgsql
    hikari:
      maximum-pool-size: ${INVOICE_DATASOURCE_MAX_POOL_SIZE:3}
      minimum-idle: ${INVOICE_DATASOURCE_MIN_IDLE:1}
      idle-timeout: ${INVOICE_DATASOURCE_IDLE_TIMEOUT_MS:30000}
      max-lifetime: ${INVOICE_DATASOURCE_MAX_LIFETIME_MS:600000}
