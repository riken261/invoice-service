spring:
  application:
    name: invoice-claim-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    openfeign:
      micrometer:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 10000
            loggerLevel: basic
      circuitbreaker:
        enabled: true
        alphanumeric-ids:
          enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        failureRateThreshold: 50
        minimumNumberOfCalls: 10
        slidingWindowSize: 20
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        slowCallDurationThreshold: 5s
        slowCallRateThreshold: 80
  timelimiter:
    configs:
      default:
        timeoutDuration: 35s
        cancelRunningFuture: true

management:
  observations:
    key-values:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    propagation:
      produce:
        - W3C
      consume:
        - W3C
    sampling:
      probability: 1.0

invoice:
  claim:
    common-service:
      base-url: ${INVOICE_COMMON_SERVICE_BASE_URL:http://localhost:8088}
